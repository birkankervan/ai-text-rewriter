name: Build Extension

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      commit_sha:
        description: 'Commit to build (the version bump commit)'
        required: true
        type: string
    outputs:
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: extension-build-${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Build the exact version-bump commit; the triggering SHA still has the old version.
          # A SHA (not the tag name) cannot be shadowed by a branch or re-pointed.
          ref: ${{ inputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package Extension
        run: pnpm package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build-${{ inputs.version }}
          path: build/chrome-mv3-prod.zip
