<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile</title>
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: linear-gradient(155deg, #191a20 0%, #0b0b0e 52%, #050506 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    color: #f5f5f7; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  img { width: 92px; height: 92px; display: block; filter: drop-shadow(0 0 0.75px rgba(255,255,255,.45)) drop-shadow(0 10px 24px rgba(0,0,0,.5)); }
  h1 { margin: 18px 0 0; font-size: 31px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 9px 0 0; font-size: 17px; line-height: 1.3; color: #a1a1a6; font-weight: 500; }
</style>
</head>
<body>
  <img src="/icon/icon-1024.png" alt="">
  <h1>Smart Translate &amp; Rewrite</h1>
  <p>Rewrite or translate any selected text</p>
</body>
</html>
